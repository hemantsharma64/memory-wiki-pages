<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hemant Memory Wiki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="unlock" class="unlock-shell">
    <section class="unlock-card">
      <div class="lock-badge">🔐 Private archive</div>
      <h1>Hemant Memory Wiki</h1>
      <p>A cleaner daily-log and subject archive for Jarvis work. The GitHub Pages payload is encrypted before it leaves this machine.</p>
      <div class="unlock-row">
        <input id="pass" type="password" placeholder="Enter passphrase" autocomplete="current-password">
        <button id="btn">Unlock</button>
      </div>
      <p id="status" class="muted"></p>
    </section>
  </main>
  <div id="app" hidden></div>
  <script src="app.js"></script>
</body>
</html>
