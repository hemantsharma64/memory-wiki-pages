<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hemant Memory Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div><p class="eyebrow">Encrypted Private Memory Wiki</p><h1>Hemant Memory Wiki</h1></div></header>
  <main>
    <section id="unlock" class="hero">
      <h2>Unlock memory archive</h2>
      <p>The data on this GitHub Pages site is encrypted. Enter the passphrase Jarvis generated for Hemant.</p>
      <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password">
      <button id="btn">Unlock</button>
      <p id="status" class="muted"></p>
    </section>
    <section id="app" hidden></section>
  </main>
  <footer>Static encrypted deployment. Repo source remains private.</footer>
  <script src="app.js"></script>
</body>
</html>
